# default_vault names which configured vault a call resolves to when --vault/vault is omitted.
# Not needed at all with exactly one vault configured (the common case) — see S009.
default_vault = "notes"

[vaults.notes]
path = "/Users/jsmith/Documents/Notes"
description = "Personal notes and knowledge base"
# db_path's default is computed per-OS — macOS: ~/Library/Application Support/mnotes/index-notes.db
# Linux: ~/.local/share/mnotes/index-notes.db (respects $XDG_DATA_HOME). Only set this to override it.
# db_path = "/Users/jsmith/Library/Application Support/mnotes/index-notes.db"

# A second (or third, ...) vault is always a manual addition — scripts/install.sh only ever prompts
# for one. Restart the daemon (`mnotes daemon restart`) after adding one.
[vaults.dnd]
path = "/Users/jsmith/Documents/DnD"
description = "D&D campaign notes"

embedding_model = "Qwen3-Embedding-0.6B" # shared across every configured vault, not per-vault

[search]
limit_default = 20          # S002
limit_max = 100              # S002
overfetch_multiplier = 5     # S002
overfetch_cap = 500          # S002
rrf_k = 60                   # S002 (README-stated default)

[notes]
size_drop_threshold = 0.50   # S003 — reject a write/edit dropping below this fraction of prior line count

[grep]
line_match_cap = 10          # S004 — line numbers shown per note before "(+N more)"

[attachments]
max_read_bytes = 10000000    # S012 — attachment_read's include_content size cap

[index]
debounce_ms = 15000                    # S005 — per-path fswatch debounce window
model_idle_unload_minutes = 10         # S005
embedding_dtype = "q8"                 # S005 — fp32 | fp16 | q8
retry_backoff_seconds = [30, 120, 600] # S005 — one entry per retry after the initial attempt
retry_max_attempts = 4                 # S005 — initial attempt + len(retry_backoff_seconds)

[logging]
rotation_max_size_mb = 10    # S008
rotation_max_age_days = 7    # S008
rotation_keep = 5            # S008
